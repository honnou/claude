<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>History in Music</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0e27;
            position: relative;
            min-height: 100vh;
            padding: 20px;
            color: #333;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(2px 2px at 60% 70%, white, transparent),
                radial-gradient(1px 1px at 50% 50%, white, transparent),
                radial-gradient(1px 1px at 80% 10%, white, transparent),
                radial-gradient(2px 2px at 90% 60%, white, transparent),
                radial-gradient(1px 1px at 33% 80%, white, transparent),
                radial-gradient(1px 1px at 15% 90%, white, transparent);
            background-size: 200% 200%, 200% 200%, 300% 300%, 250% 250%, 200% 200%, 280% 280%, 240% 240%;
            background-position: 0% 0%, 50% 50%, 100% 0%, 0% 100%, 50% 100%, 100% 50%, 25% 75%;
            animation: twinkle 120s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .container {
            position: relative;
            z-index: 1;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
            font-weight: 700;
        }

        .subtitle {
            font-size: 1rem;
            opacity: 0.95;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.3);
        }

        .card {
            background: linear-gradient(135deg,
                rgba(102, 126, 234, 0.15) 0%,
                rgba(118, 75, 162, 0.15) 15%,
                rgba(240, 147, 251, 0.15) 30%,
                rgba(245, 87, 108, 0.15) 45%,
                rgba(254, 202, 87, 0.15) 60%,
                rgba(72, 219, 251, 0.15) 75%,
                rgba(10, 189, 227, 0.15) 90%,
                rgba(102, 126, 234, 0.15) 100%
            );
            background-size: 200% 200%;
            animation: rainbowShift 20s ease infinite;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes rainbowShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .generate-btn {
            width: 100%;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg,
                rgba(102, 126, 234, 0.9) 0%,
                rgba(118, 75, 162, 0.9) 25%,
                rgba(245, 87, 108, 0.9) 50%,
                rgba(254, 202, 87, 0.9) 75%,
                rgba(72, 219, 251, 0.9) 100%
            );
            background-size: 200% 200%;
            animation: buttonGradient 3s ease infinite;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        @keyframes buttonGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .generate-btn:active {
            transform: scale(0.98);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: white;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .results.show {
            display: block;
        }

        .playlist-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .playlist-title {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 8px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(102, 126, 234, 0.8);
        }

        .playlist-description {
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.6;
        }

        .section-title {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 15px rgba(240, 147, 251, 0.6);
        }

        .event-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 4px solid rgba(102, 126, 234, 0.8);
        }

        .event-year {
            font-weight: 700;
            color: #fff;
            font-size: 1.1rem;
            text-shadow: 0 0 10px rgba(102, 126, 234, 0.8);
        }

        .event-text {
            margin-top: 8px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.9);
        }

        .event-location {
            margin-top: 8px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .event-links {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .wiki-link, .music-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s;
            font-weight: 500;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .wiki-link:hover, .wiki-link:active,
        .music-link:hover, .music-link:active {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .genre-timeline {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow-x: auto;
        }

        .timeline-container {
            display: flex;
            gap: 12px;
            min-width: max-content;
            padding: 10px 0;
        }

        .timeline-era {
            flex: 0 0 auto;
            min-width: 150px;
        }

        .era-label {
            font-size: 0.85rem;
            color: white;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-shadow: 0 0 8px rgba(72, 219, 251, 0.6);
        }

        .era-genres {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .genre-pill {
            background: linear-gradient(135deg,
                rgba(102, 126, 234, 0.3) 0%,
                rgba(240, 147, 251, 0.3) 50%,
                rgba(72, 219, 251, 0.3) 100%
            );
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            color: white;
            padding: 8px 14px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            white-space: nowrap;
            text-decoration: none;
            display: block;
            transition: all 0.2s;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .genre-pill:hover, .genre-pill:active {
            background: linear-gradient(135deg,
                rgba(102, 126, 234, 0.5) 0%,
                rgba(240, 147, 251, 0.5) 50%,
                rgba(72, 219, 251, 0.5) 100%
            );
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .genre-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .genre-tag {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #1a1a2e;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }


        .error {
            background: rgba(255, 243, 205, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 193, 7, 0.5);
            color: #856404;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            .card {
                padding: 16px;
            }

            .generate-btn {
                padding: 16px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 History in Music</h1>
            <p class="subtitle">Daily playlists inspired by historical events</p>
        </header>

        <div class="card">
            <button class="generate-btn" id="generateBtn" onclick="generatePlaylist()">
                Generate Today's Playlist
            </button>
        </div>

        <div id="loading" class="card loading" style="display: none;">
            <div class="spinner"></div>
            <p>Discovering history and finding music...</p>
        </div>

        <div id="error" class="card error" style="display: none;">
            <strong>Error:</strong> <span id="errorMessage"></span>
        </div>

        <div id="results" class="results">
            <div class="card">
                <div class="playlist-header">
                    <h2 class="playlist-title" id="playlistTitle"></h2>
                    <p class="playlist-description" id="playlistDescription"></p>
                </div>

                <div style="margin-bottom: 24px;">
                    <h3 class="section-title">📜 Historical Events</h3>
                    <div id="eventsList"></div>
                </div>

                <div style="margin-bottom: 24px;">
                    <h3 class="section-title">🎸 Musical Journey Through Time</h3>
                    <p style="color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-bottom: 16px; text-align: center;">
                        Tap any genre to explore music on YouTube
                    </p>
                    <div class="genre-timeline">
                        <div class="timeline-container" id="genreTimeline"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function generatePlaylist() {
            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const error = document.getElementById('error');

            // Hide previous results and errors
            results.classList.remove('show');
            error.style.display = 'none';

            // Show loading
            btn.disabled = true;
            loading.style.display = 'block';

            try {
                const response = await fetch('/api/generate-playlist');
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'Failed to generate playlist');
                }

                // Hide loading
                loading.style.display = 'none';

                // Create YouTube search links for genres
                createYouTubeTracks(data.data);

                // Update UI with results
                displayResults(data.data);

                // Show results
                results.classList.add('show');
            } catch (err) {
                loading.style.display = 'none';
                error.style.display = 'block';
                document.getElementById('errorMessage').textContent = err.message;
            } finally {
                btn.disabled = false;
            }
        }

        function createYouTubeTracks(data) {
            // Create YouTube Music search links for each genre
            data.youtubeVideos = data.genres.slice(0, 15).map((genre, index) => {
                const searchQuery = encodeURIComponent(`${genre.genre} music playlist`);
                return {
                    id: `track-${index}`,
                    title: `${genre.genre.charAt(0).toUpperCase() + genre.genre.slice(1)} Playlist`,
                    genre: genre.genre,
                    era: genre.era,
                    url: `https://music.youtube.com/search?q=${searchQuery}`,
                    youtubeUrl: `https://www.youtube.com/results?search_query=${searchQuery}`
                };
            });

            // Map genres to events based on region/country
            data.events.forEach(event => {
                // Find genres that match this event's region or are from the same era
                const matchingGenres = data.genres.filter(genre => {
                    // Match by year/era
                    const eventYear = event.year;
                    if (eventYear < 1900 && genre.era === 'early') return true;
                    if (eventYear >= 1920 && eventYear < 1950 && genre.era === '1920s-1940s') return true;
                    if (eventYear >= 1950 && eventYear < 1970 && (genre.era === '1950s-1960s' || genre.era === '1960s-1970s')) return true;
                    if (eventYear >= 1970 && eventYear < 1990 && (genre.era === '1970s-1980s' || genre.era === '1980s-1990s')) return true;
                    if (eventYear >= 1990 && eventYear < 2010 && genre.era === '1990s-2000s') return true;
                    if (eventYear >= 2010 && genre.era === 'modern') return true;
                    return false;
                });

                // Assign 1-2 relevant genres to this event
                event.associatedGenres = matchingGenres.slice(0, 2);
            });
        }

        function createWikipediaLink(year, text) {
            const match = text.match(/^([^,]+)/);
            if (match) {
                const searchTerm = match[1].trim();
                const encodedTerm = encodeURIComponent(searchTerm);
                return `https://en.wikipedia.org/wiki/Special:Search?search=${encodedTerm}+${year}`;
            }
            return `https://en.wikipedia.org/wiki/${year}`;
        }

        function displayResults(data) {
            // Playlist header
            document.getElementById('playlistTitle').textContent = data.playlistName;
            document.getElementById('playlistDescription').textContent = data.playlistDescription;

            // Events list with Wikipedia and music links
            const eventsList = document.getElementById('eventsList');
            eventsList.innerHTML = data.events.map(event => {
                const wikiUrl = createWikipediaLink(event.year, event.text);

                // Create music links for this event
                let musicLinksHTML = '';
                if (event.associatedGenres && event.associatedGenres.length > 0) {
                    musicLinksHTML = event.associatedGenres.map(genre => {
                        const searchQuery = encodeURIComponent(`${genre.genre} music`);
                        const url = `https://music.youtube.com/search?q=${searchQuery}`;
                        const genreName = genre.genre.charAt(0).toUpperCase() + genre.genre.slice(1);
                        return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="music-link">
                            🎵 Listen to ${genreName} on YouTube
                        </a>`;
                    }).join('');
                }

                return `
                    <div class="event-item">
                        <div class="event-year">${event.year}</div>
                        <div class="event-text">${event.text}</div>
                        ${event.region ? `
                            <div class="event-location">
                                📍 ${event.region}${event.country ? ` - ${event.country}` : ''}
                            </div>
                        ` : ''}
                        <div class="event-links">
                            ${musicLinksHTML}
                            <a href="${wikiUrl}" target="_blank" rel="noopener noreferrer" class="wiki-link">
                                📖 Read on Wikipedia
                            </a>
                        </div>
                    </div>
                `;
            }).join('');

            // Create timeline grouped by era
            const genreTimeline = document.getElementById('genreTimeline');
            const genresByEra = {};

            data.genres.forEach(genre => {
                if (!genresByEra[genre.era]) {
                    genresByEra[genre.era] = [];
                }
                genresByEra[genre.era].push(genre);
            });

            // Sort eras chronologically
            const eraOrder = ['early', '1920s-1940s', '1950s-1960s', '1960s-1970s', '1970s-1980s', '1980s-1990s', '1990s-2000s', 'modern'];
            const sortedEras = Object.keys(genresByEra).sort((a, b) => {
                return eraOrder.indexOf(a) - eraOrder.indexOf(b);
            });

            genreTimeline.innerHTML = sortedEras.map(era => {
                const genres = genresByEra[era];
                // Remove duplicates but keep genre objects for links
                const uniqueGenres = genres.filter((genre, index, self) =>
                    index === self.findIndex((g) => g.genre === genre.genre)
                );

                return `
                    <div class="timeline-era">
                        <div class="era-label">${era}</div>
                        <div class="era-genres">
                            ${uniqueGenres.map(genre => {
                                const searchQuery = encodeURIComponent(`${genre.genre} music`);
                                const url = `https://music.youtube.com/search?q=${searchQuery}`;
                                return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="genre-pill">${genre.genre}</a>`;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
